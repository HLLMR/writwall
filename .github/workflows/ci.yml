name: Capability wall and standard-library suite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision declared build backend
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "setuptools>=77"
      - name: Focused capability-wall, dispatch, and init tests
        run: >-
          python -B -m unittest
          tests.test_wo_capability_wall
          tests.test_check_work_order_dispatch
          tests.test_init_sh
          tests.test_uninstall_writwall
      - name: Full standard-library suite
        if: ${{ matrix.python-version != '3.10' }}
        run: python -B -m unittest discover -s tests

  required:
    name: CI required
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = "success"
